<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التسجيل | أكاديمية رشيد</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:#f7f7f7;color:#173b32;padding:18px}
.wrap{max-width:720px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin-bottom:14px}
h1{margin:8px 0 4px;color:#0b5b47;font-size:28px}
p{margin:0 0 14px}
label{display:block;font-weight:700;margin:12px 0 5px}
input,select,textarea,button,a.btn{width:100%;display:block;font:inherit;font-size:16px;padding:12px;border-radius:10px}
input,select,textarea{border:1px solid #cfd8d5;background:white}
textarea{min-height:110px}
button,a.btn{border:0;text-align:center;text-decoration:none;font-weight:700;cursor:pointer}
.primary{background:#0b5b47;color:white}
.secondary{background:#edf3f1;color:#173b32;margin-top:9px}
.choice{padding:10px;border:1px solid #dce8e3;border-radius:10px;margin:7px 0;background:#f8fbfa}
.choice strong{display:block;color:#0b5b47}
.msg{display:none;padding:12px;margin-top:12px;border-radius:10px}
.ok{background:#eaf8f1;border:1px solid #b7dfcc}
.err{background:#fff0f0;border:1px solid #efc2c2;color:#8b2424}
@media(max-width:600px){
 body{padding:12px}
 h1{font-size:24px}
 .card{padding:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>أكمل بيانات التسجيل</h1>
    <p>أكمل بيانات الطالب بعد اختيار البرنامج أو المسار.</p>
  </div>

  <div class="card">
    <h2 style="margin-top:0">اختياراتك التعليمية</h2>
    <div id="summary">جارٍ تحميل اختياراتك...</div>
    <a class="btn secondary" href="index.html">تعديل / إضافة اختيارات</a>
  </div>

  <form id="regForm" class="card">
    <label>الاسم الكامل</label>
    <input id="fullName" required>

    <label>العمر</label>
    <input id="age" type="number" min="4" max="100" required>

    <label>الدولة / المدينة</label>
    <input id="country" required placeholder="مثال: الرياض - السعودية">

    <label>رقم واتساب</label>
    <input id="whatsapp" inputmode="tel" required placeholder="+9665xxxxxxxx">

    <label>الوقت المفضل</label>
    <select id="time" required>
      <option value="">اختر الوقت</option>
      <option>صباحًا</option>
      <option>مساءً</option>
      <option>مرن</option>
    </select>

    <label>التسجيل لـ</label>
    <select id="studentType">
      <option>نفسي</option>
      <option>ابني / ابنتي</option>
      <option>أكثر من طالب</option>
    </select>

    <label>ملاحظات أو هدف التعلم</label>
    <textarea id="notes"></textarea>

    <button id="submitBtn" class="primary" type="submit">إرسال طلب التسجيل</button>
    <a class="btn secondary" href="index.html">العودة للاختيارات</a>

    <div id="ok" class="msg ok">✓ تم إرسال طلب التسجيل بنجاح.</div>
    <div id="err" class="msg err">تعذر إرسال الطلب الآن. حاول مرة أخرى.</div>
  </form>
</div>

<script>
(function(){
  var SB="https://crnlfpuipepolflqcwuo.supabase.co";
  var KEY="sb_publishable_bW_x_9cHxqhuxkYdZ-g4kQ_3UAukGRV";
  var selections=[];

  try{
    var raw=sessionStorage.getItem("rasheedStudySelections");
    selections=raw?JSON.parse(raw):[];
    if(!Array.isArray(selections)) selections=[];
  }catch(e){selections=[];}

  try{
    var qs=location.search||"";
    var m=qs.match(/[?&]track=([^&]+)/);
    if(m){
      var track=decodeURIComponent(m[1].replace(/\+/g," "));
      if(track==="memorization") track="الحفظ والإتقان";
      var found=false;
      for(var i=0;i<selections.length;i++){
        if(selections[i] && selections[i].key==="quran" && selections[i].tracks){
          for(var j=0;j<selections[i].tracks.length;j++){
            if(selections[i].tracks[j]===track){found=true;break;}
          }
        }
      }
      if(!found) selections.push({key:"quran",title:"القرآن الكريم والعلوم الشرعية",tracks:[track]});
    }
  }catch(e){}

  var summary=document.getElementById("summary");
  if(selections.length===0){
    summary.innerHTML='<div class="choice">لم تصل اختيارات تعليمية بعد. ارجع واختر البرنامج أو المسار.</div>';
  }else{
    var h="";
    for(var a=0;a<selections.length;a++){
      var x=selections[a]||{};
      var parts=[];
      if(x.system) parts.push(x.system);
      if(x.stage) parts.push(x.stage);
      if(x.grade) parts.push(x.grade);
      if(x.branch) parts.push(x.branch);
      if(x.subjects && x.subjects.length) parts=parts.concat(x.subjects);
      if(x.tracks && x.tracks.length) parts=parts.concat(x.tracks);
      h+='<div class="choice"><strong>'+(x.title||"اختيار تعليمي")+'</strong>'+parts.join(" • ")+'</div>';
    }
    summary.innerHTML=h;
  }

  function firstTrack(){
    for(var i=0;i<selections.length;i++){
      if(selections[i] && selections[i].tracks && selections[i].tracks.length) return selections[i].tracks[0];
    }
    return selections.length ? (selections[0].title||selections[0].key||null) : null;
  }

  document.getElementById("regForm").onsubmit=function(ev){
    ev.preventDefault();
    var form=this;
    if(!form.checkValidity()){ if(form.reportValidity) form.reportValidity(); return; }
    if(!selections.length){ alert("اختر البرنامج أو المسار أولًا."); return; }

    var btn=document.getElementById("submitBtn");
    btn.disabled=true;
    btn.textContent="جارٍ الإرسال...";

    var payload={
      full_name:document.getElementById("fullName").value,
      age:Number(document.getElementById("age").value)||null,
      country_city:document.getElementById("country").value,
      whatsapp:document.getElementById("whatsapp").value,
      preferred_time:document.getElementById("time").value,
      registration_for:document.getElementById("studentType").value,
      notes:document.getElementById("notes").value,
      study_selections:selections,
      status:"new",
      track:firstTrack(),
      level:null
    };

    fetch(SB+"/rest/v1/registrations",{
      method:"POST",
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      try{sessionStorage.removeItem("rasheedStudySelections");}catch(e){}
      document.getElementById("ok").style.display="block";
      btn.style.display="none";
    }).catch(function(e){
      console.log(e);
      document.getElementById("err").style.display="block";
      btn.disabled=false;
      btn.textContent="إرسال طلب التسجيل";
    });
  };
})();
</script>
</body>
</html>
